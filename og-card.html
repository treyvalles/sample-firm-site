<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; background: #1d2b3c;
         font-family: "Source Sans 3", system-ui, sans-serif; overflow: hidden; }
  .card { width: 1200px; height: 630px; padding: 74px 86px;
          display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-size: 21px; font-weight: 600; letter-spacing: 0.16em;
             text-transform: uppercase; color: #b98a52; display: flex;
             align-items: center; gap: 16px; }
  .diamond { display: inline-block; width: 14px; height: 14px;
             background: #b98a52; transform: rotate(45deg); }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 700;
       font-size: 76px; line-height: 1.1; color: #f5f1e8; margin: 26px 0 0;
       max-width: 15ch; letter-spacing: -0.01em; }
  .sub { font-family: "Source Serif 4", Georgia, serif; font-size: 30px;
         line-height: 1.4; color: #c8d1db; margin: 22px 0 0; max-width: 30ch; }
  .rule { width: 96px; height: 3px; background: #b98a52; margin: 34px 0 0; }
  .foot { display: flex; justify-content: space-between; align-items: baseline;
          border-top: 1px solid rgba(245,241,232,0.22); padding-top: 24px; }
  .foot .who { font-size: 23px; font-weight: 600; color: #f5f1e8; }
  .foot .what { font-size: 20px; color: #c8d1db; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="eyebrow"><span class="diamond"></span>Sample build</div>
      <h1>Alder Creek CPA</h1>
      <p class="sub">A one-page site for a fictional accounting firm, built to show a finished client build.</p>
      <div class="rule"></div>
    </div>
    <div class="foot">
      <div class="who">Trey Valles</div>
      <div class="what">Foundation tier, $500 one time</div>
    </div>
  </div>
</body>
</html>
